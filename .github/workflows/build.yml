name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preloader-Header holen
        run: git clone --depth 1 https://github.com/LiteLDev/preloader-android preloader
      - name: Bauen
        run: |
          ls preloader/include/pl
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DPRELOADER_ANDROID_ROOT="$GITHUB_WORKSPACE/preloader"
          cmake --build build -j
      - name: Paket
        run: |
          find build -name "*.so"
          mkdir out
          cp $(find build -name "*.so" | head -n1) out/libRenderDistanceKeys.so
          cp manifest.json out/
          cd out
          zip ../RenderDistanceKeys.levipack *
      - uses: actions/upload-artifact@v4
        with:
          name: RenderDistanceKeys
          path: |
            out/libRenderDistanceKeys.so
            RenderDistanceKeys.levipack
