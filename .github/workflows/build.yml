name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preloader-Header holen
        run: git clone --depth 1 https://github.com/LiteLDev/preloader-android preloader
      - name: Bauen
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DPRELOADER_ANDROID_ROOT="$GITHUB_WORKSPACE/preloader"
          cmake --build build -j
      - name: Paket
        run: |
          find build -name "*.so"
          mkdir out
          cp "$(find build -name libRenderDistanceKeys.so | head -n1)" out/libRenderDistanceKeys.so
          cp manifest.json out/
          BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "--- Benoetigte Bibliotheken ---"
          $BIN/llvm-readelf -d out/libRenderDistanceKeys.so | grep NEEDED
          echo "--- Exportierte Symbole ---"
          $BIN/llvm-nm -D --defined-only out/libRenderDistanceKeys.so | head -20
          cd out
          zip ../RenderDistanceKeys.levipack *
      - uses: actions/upload-artifact@v4
        with:
          name: RenderDistanceKeys
          path: |
            out/libRenderDistanceKeys.so
            RenderDistanceKeys.levipack
