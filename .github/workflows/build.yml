name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SDK-Header holen
        run: git clone --depth 1 https://github.com/liteldev/levilaunchroid sdk
      - name: Bauen
        run: |
          INC=$(find sdk -type d -name include | head -n1)
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DLEVI_SDK_INCLUDE="$GITHUB_WORKSPACE/$INC"
          cmake --build build -j
      - name: Paket
        run: |
          mkdir out
          cp build/libRenderDistanceKeys.so manifest.json out/
          cd out
          zip ../RenderDistanceKeys.levipack *
      - uses: actions/upload-artifact@v4
        with:
          name: RenderDistanceKeys
          path: |
            build/libRenderDistanceKeys.so
            RenderDistanceKeys.levipack 
